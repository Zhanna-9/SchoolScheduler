<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Scheduler</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f6f9;
}

header{
    background:#1e3a8a;
    color:white;
    padding:25px;
    text-align:center;
}

.container{
    width:90%;
    margin:auto;
    margin-top:40px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:15px;
    padding:30px;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    transition:0.3s;
    cursor:pointer;
}

.card:hover{
    transform:translateY(-5px);
}

.card h2{
    margin:0;
    color:#1e3a8a;
}

</style>

</head>

<body>

<header>
    <h1>📚 School Scheduler</h1>
    <p>Система автоматического составления школьного расписания</p>
</header>

<div class="container">


<div class="grid">

    <div class="card" onclick="location.href='teachers.html'">
        <h2>👨‍🏫 Учителя</h2>
    </div>

    <div class="card" onclick="location.href='classes.html'">
        <h2>🏫 Классы</h2>
    </div>

    <div class="card" onclick="location.href='rooms.html'">
        <h2>🚪 Кабинеты</h2>
    </div>

    <div class="card" onclick="location.href='subjects.html'">
        <h2>📖 Предметы</h2>
    </div>

    <div class="card" onclick="location.href='load.html'">
        <h2>📊 Нагрузка</h2>
    </div>

    <div class="card" onclick="location.href='schedule.html'">
        <h2>⚡ Генерация расписания</h2>
    </div>

</div>

</body>
</html>
